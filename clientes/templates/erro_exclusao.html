<!DOCTYPE html>
<html>
<head>
    <title>Ação Bloqueada</title>

    <style>
    body {
        margin: 0;
        background: #0f172a;
        color: white;
        font-family: Arial;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 20px;
        box-sizing: border-box;
    }

    .card {
        background: #1e293b;
        padding: 35px;
        border-radius: 14px;
        width: 420px;
        text-align: center;
        border: 1px solid #334155;
        box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        box-sizing: border-box;
    }

    .icon {
        font-size: 45px;
        margin-bottom: 15px;
    }

    h2 {
        margin: 0;
        color: #ef4444;
    }

    p {
        color: #cbd5e1;
        line-height: 1.5;
    }

    a {
        display: inline-block;
        margin-top: 20px;
        background: #2563eb;
        color: white;
        padding: 12px 18px;
        border-radius: 8px;
        text-decoration: none;
        font-weight: bold;
    }

    a:hover {
        background: #1d4ed8;
    }

    /* RESPONSIVO */

    @media (max-width: 768px) {

        body {
            padding: 15px;
        }

        .card {
            width: 100%;
            padding: 25px;
        }

        .icon {
            font-size: 38px;
        }

        h2 {
            font-size: 24px;
        }

        p {
            font-size: 14px;
        }

        a {
            width: 100%;
            box-sizing: border-box;
            text-align: center;
            font-size: 15px;
            padding: 13px;
        }
    }
</style>
</head>

<body>

<div class="card">
    <div class="icon">⚠️</div>

    <h2>{{ mensagem }}</h2>

    <p>{{ detalhe }}</p>

    <a href="/parcelas/">Voltar para Parcelas</a>
</div>

</body>
</html>
