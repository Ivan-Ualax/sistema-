<!DOCTYPE html>
<html>
<head>
    <title>Novo Cliente</title>

   <style>
    body {
        margin: 0;
        padding: 20px;
        font-family: Arial;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        min-height: 100vh;
        background: #0f172a;
        color: white;
        box-sizing: border-box;
    }

    .card {
        background: #1e293b;
        padding: 25px;
        border-radius: 20px;
        width: 100%;
        max-width: 480px;
        box-shadow: 0 0 30px rgba(0,0,0,0.4);
        border: 1px solid #334155;
        box-sizing: border-box;
    }

    h2 {
        text-align: center;
        margin-bottom: 20px;
        font-size: 30px;
    }

    .form-group {
        display: flex;
        flex-direction: column;
        margin-bottom: 14px;
    }

    label {
        font-size: 14px;
        color: #cbd5e1;
        margin-bottom: 8px;
        font-weight: bold;
    }

    input,
    select,
    textarea {
        width: 100%;
        padding: 12px;
        border-radius: 12px;
        border: 1px solid #334155;
        background: #020617;
        color: white;
        outline: none;
        font-size: 15px;
        box-sizing: border-box;
        transition: 0.2s;
    }

    input:focus,
    select:focus,
    textarea:focus {
        border: 1px solid #2563eb;
        box-shadow: 0 0 10px rgba(37,99,235,0.3);
    }

    textarea {
        min-height: 80px;
        resize: vertical;
        line-height: 1.4;
    }

    .status-group {
        margin-top: 10px;
    }

    .btn {
        width: 100%;
        padding: 12px;
        border-radius: 12px;
        cursor: pointer;
        margin-top: 14px;
        border: none;
        font-size: 16px;
        font-weight: bold;
        transition: 0.2s;
        box-sizing: border-box;
    }

    .btn-primary {
        background: linear-gradient(90deg, #2563eb, #3b82f6);
        color: white;
    }

    .btn-primary:hover {
        background: linear-gradient(90deg, #1d4ed8, #2563eb);
        transform: scale(1.01);
    }

    .btn-secondary {
        background: #334155;
        color: white;
        text-decoration: none;
        display: block;
        text-align: center;
        line-height: normal;
    }

    .btn-secondary:hover {
        background: #475569;
    }

    /* RESPONSIVO */

    @media (max-width: 700px) {

        body {
            padding: 15px;
        }

        .card {
            padding: 20px;
            border-radius: 16px;
        }

        h2 {
            font-size: 26px;
        }

        label {
            font-size: 13px;
        }

        input,
        select,
        textarea {
            padding: 11px;
            font-size: 16px;
        }

        textarea {
            min-height: 70px;
        }

        .btn {
            font-size: 15px;
            padding: 11px;
        }
    }

</style>
</head>

<body>

<div class="card">

    <h2>👤 Novo Cliente</h2>

    <form method="POST">
        {% csrf_token %}

        <div class="form-group">
            <label>Nome</label>
            <input type="text" name="nome" required>
        </div>

        <div class="form-group">
            <label>CPF</label>
            <input type="text" name="cpf" placeholder="000.000.000-00" required>
        </div>

        <div class="form-group">
            <label>Telefone</label>
            <input type="text" name="telefone" placeholder="(00) 00000-0000" required>
        </div>

        <div class="form-group">
            <label>Localização / Endereço (opcional)</label>

            <textarea
                name="localizacao"
                placeholder="Digite a localização ou endereço completo do cliente..."
            ></textarea>
        </div>

        <div class="form-group status-group">
            <label>Status</label>

            <select name="status">
                <option value="True">🟢 Ativo</option>
                <option value="False">🔴 Inativo</option>
            </select>
        </div>

        <button type="submit" class="btn btn-primary">
            💾 Salvar Cliente
        </button>
    </form>

    <a href="/clientes/" class="btn btn-secondary">
        ← Voltar
    </a>

</div>

</body>
</html>
