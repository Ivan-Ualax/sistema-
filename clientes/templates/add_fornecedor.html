<!DOCTYPE html>
<html>
<head>
    <title>Fornecedor</title>

<style>
    body {
        background: #0f172a;
        color: white;
        font-family: Arial;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
        margin: 0;
        box-sizing: border-box;
    }

    .card {
        background: #1e293b;
        padding: 30px;
        border-radius: 12px;
        width: 420px;
        box-shadow: 0 0 20px rgba(0,0,0,0.3);
        box-sizing: border-box;
    }

    h2 {
        margin-bottom: 20px;
    }

    input,
    textarea,
    select {
        width: 95%;
        padding: 12px;
        margin-top: 12px;
        border: none;
        border-radius: 8px;
        background: #0f172a;
        color: white;
        box-sizing: border-box;
    }

    textarea {
        resize: none;
        height: 80px;
    }

    button {
        margin-top: 18px;
        width: 100%;
        padding: 12px;
        background: #2563eb;
        border: none;
        border-radius: 8px;
        color: white;
        font-weight: bold;
        cursor: pointer;
    }

    button:hover {
        background: #1d4ed8;
    }

    a {
        display: block;
        margin-top: 15px;
        text-align: center;
        color: #38bdf8;
        text-decoration: none;
    }

    /* RESPONSIVO */

    @media (max-width: 768px) {

        body {
            padding: 15px;
            align-items: flex-start;
        }

        .card {
            width: 100%;
            padding: 20px;
        }

        h2 {
            font-size: 24px;
        }

        input,
        textarea,
        select,
        button {
            width: 100%;
            font-size: 16px;
        }
    }
</style>
</head>

<body>

<div class="card">

<h2>🏢 Novo Fornecedor</h2>

<form method="POST">
    {% csrf_token %}

    <input type="text" name="nome" placeholder="Nome do fornecedor" required>

    <input type="text" name="cnpj" placeholder="CNPJ">

    <input type="text" name="telefone" placeholder="Telefone">

    <input type="email" name="email" placeholder="E-mail">

    <input type="text" name="endereco" placeholder="Endereço">

    <textarea name="observacao" placeholder="Observações"></textarea>

    <select name="ativo">
        <option value="True">Ativo 🟢</option>
        <option value="False">Inativo 🔴</option>
    </select>

    <button type="submit">
        Salvar Fornecedor
    </button>
</form>

<a href="/fornecedores/">
    Voltar
</a>

</div>

</body>
</html>
