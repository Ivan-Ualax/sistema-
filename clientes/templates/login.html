<!DOCTYPE html>
<html>
<head>
    <title>Login - IvanTech</title>

    <style>
    body {
        margin: 0;
        background: #0f172a;
        color: white;
        font-family: Arial;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
        box-sizing: border-box;
    }

    .card {
        background: #1e293b;
        padding: 35px;
        border-radius: 14px;
        width: 360px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        border: 1px solid #334155;
        box-sizing: border-box;
    }

    h2 {
        text-align: center;
        margin-bottom: 5px;
    }

    p {
        text-align: center;
        color: #94a3b8;
        font-size: 14px;
        margin-bottom: 25px;
    }

    label {
        display: block;
        margin-top: 12px;
        color: #cbd5e1;
    }

    input {
        width: 100%;
        padding: 11px;
        margin-top: 6px;
        border-radius: 8px;
        border: 1px solid #334155;
        background: #0f172a;
        color: white;
        box-sizing: border-box;
    }

    button {
        width: 100%;
        margin-top: 22px;
        padding: 12px;
        background: #2563eb;
        border: none;
        color: white;
        border-radius: 8px;
        cursor: pointer;
        font-weight: bold;
    }

    button:hover {
        background: #1d4ed8;
    }

    .erro {
        background: #7f1d1d;
        color: white;
        padding: 10px;
        border-radius: 8px;
        margin-bottom: 15px;
        text-align: center;
        font-size: 14px;
        box-sizing: border-box;
    }

    /* RESPONSIVO */

    @media (max-width: 768px) {

        body {
            padding: 15px;
            align-items: flex-start;
        }

        .card {
            width: 100%;
            padding: 25px;
        }

        h2 {
            font-size: 24px;
        }

        p {
            font-size: 13px;
            margin-bottom: 20px;
        }

        label {
            font-size: 14px;
        }

        input,
        button {
            font-size: 16px;
        }

        button {
            padding: 13px;
        }

        .erro {
            font-size: 13px;
        }
    }
</style>
</head>

<body>

<div class="card">
    <h2>IvanTech</h2>
    <p>Sistema de Gestão Empresarial</p>

    {% if erro %}
        <div class="erro">{{ erro }}</div>
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <label>Usuário</label>
        <input type="text" name="usuario" required>

        <label>Senha</label>
        <input type="password" name="senha" required>

        <button type="submit">Entrar</button>
    </form>
</div>

</body>
</html>
