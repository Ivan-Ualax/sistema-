<!DOCTYPE html>
<html>
<head>
    <title>Nova Despesa</title>

    <style>
    body {
        background: #0f172a;
        font-family: Arial;
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 20px;
        box-sizing: border-box;
    }

    .card {
        background: #1e293b;
        padding: 30px;
        border-radius: 12px;
        width: 380px;
        border: 1px solid #334155;
        box-shadow: 0 10px 30px rgba(0,0,0,0.35);
        box-sizing: border-box;
    }

    h2 {
        margin-top: 0;
    }

    label {
        display: block;
        margin-top: 12px;
        color: #cbd5e1;
    }

    input,
    select,
    textarea {
        width: 100%;
        padding: 10px;
        margin-top: 6px;
        background: #0f172a;
        border: 1px solid #334155;
        color: white;
        border-radius: 6px;
        box-sizing: border-box;
    }

    textarea {
        min-height: 80px;
        resize: vertical;
    }

    button {
        width: 100%;
        padding: 11px;
        margin-top: 18px;
        background: #ef4444;
        border: none;
        border-radius: 6px;
        color: white;
        cursor: pointer;
        font-weight: bold;
    }

    button:hover {
        background: #dc2626;
    }

    .voltar {
        margin-top: 10px;
        display: block;
        text-align: center;
        border: 1px solid #334155;
        padding: 8px;
        border-radius: 6px;
        text-decoration: none;
        color: white;
    }

    .voltar:hover {
        background: #0f172a;
    }

    /* RESPONSIVO */

    @media (max-width: 768px) {

        body {
            padding: 15px;
            align-items: flex-start;
        }

        .card {
            width: 100%;
            padding: 20px;
        }

        h2 {
            font-size: 24px;
        }

        input,
        select,
        textarea,
        button {
            font-size: 16px;
        }
    }
</style>
</head>

<body>

<div class="card">
    <h2>Nova Despesa</h2>

    <form method="POST">
        {% csrf_token %}

        <label>Nome da despesa</label>
        <input type="text" name="nome" placeholder="Ex: Luz, aluguel, internet" required>

        <label>Valor</label>
        <input type="text" name="valor" placeholder="Ex: 250,00" required>

        <label>Categoria</label>
        <select name="categoria" required>
            <option value="fixa">Fixa</option>
            <option value="variavel">Variável</option>
        </select>

        <label>Observação</label>
        <textarea name="observacao" placeholder="Opcional"></textarea>

        <button type="submit">Salvar Despesa</button>
    </form>

    <a href="/despesas/" class="voltar">Voltar</a>
</div>

</body>
</html>
