<!DOCTYPE html>
<html>
<head>
    <title>Editar Fornecedor</title>

    <style>
    body {
        background: #0f172a;
        color: white;
        font-family: Arial;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
        margin: 0;
        box-sizing: border-box;
    }

    .card {
        background: #1e293b;
        padding: 30px;
        border-radius: 12px;
        width: 420px;
        box-sizing: border-box;
    }

    input,
    textarea,
    select {
        width: 95%;
        padding: 12px;
        margin-top: 12px;
        border: none;
        border-radius: 8px;
        background: #0f172a;
        color: white;
        box-sizing: border-box;
    }

    textarea {
        resize: none;
        height: 80px;
    }

    button {
        margin-top: 15px;
        width: 100%;
        padding: 12px;
        background: #22c55e;
        border: none;
        border-radius: 8px;
        color: white;
        font-weight: bold;
        cursor: pointer;
    }

    /* RESPONSIVO */

    @media (max-width: 768px) {

        body {
            padding: 15px;
            align-items: flex-start;
        }

        .card {
            width: 100%;
            padding: 22px;
        }

        h2 {
            font-size: 24px;
        }

        input,
        textarea,
        select,
        button {
            width: 100%;
            font-size: 16px;
        }

        textarea {
            height: 100px;
        }

        button {
            padding: 13px;
        }
    }
</style>
</head>

<body>

<div class="card">

<h2>Editar Fornecedor</h2>

<form method="POST">
    {% csrf_token %}

    <input name="nome" value="{{ fornecedor.nome }}">

    <input name="cnpj" value="{{ fornecedor.cnpj }}">

    <input name="telefone" value="{{ fornecedor.telefone }}">

    <input name="email" value="{{ fornecedor.email }}">

    <input name="endereco" value="{{ fornecedor.endereco }}">

    <textarea name="observacao">{{ fornecedor.observacao }}</textarea>

    <select name="ativo">
        <option value="True" {% if fornecedor.ativo %}selected{% endif %}>
            Ativo 🟢
        </option>

        <option value="False" {% if not fornecedor.ativo %}selected{% endif %}>
            Inativo 🔴
        </option>
    </select>

    <button>
        Salvar
    </button>

</form>

</div>

</body>
</html>
