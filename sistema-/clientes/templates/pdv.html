<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PDV</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    min-height:100vh;
    background:
        radial-gradient(circle at top left, rgba(34,197,94,0.20), transparent 34%),
        radial-gradient(circle at bottom right, rgba(56,189,248,0.10), transparent 35%),
        linear-gradient(135deg,#020617,#0f172a);
    color:white;
    padding:12px;
}

form{
    width:100%;
    margin:0;
}

.topo{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:12px;
    padding:22px 28px;
    background:rgba(15,23,42,0.92);
    border:1px solid rgba(148,163,184,0.22);
    border-radius:22px;
    box-shadow:0 20px 60px rgba(0,0,0,0.35);
}

.topo h1{
    font-size:38px;
}

.links{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    align-items:center;
}

.links a{
    text-decoration:none;
    font-weight:bold;
    padding:11px 15px;
    border-radius:999px;
    background:rgba(15,23,42,0.85);
    border:1px solid rgba(148,163,184,0.18);
}

.status{
    padding:11px 18px;
    border-radius:999px;
    font-weight:bold;
}

.aberto{
    background:linear-gradient(135deg,#15803d,#22c55e);
}

.fechado{
    background:linear-gradient(135deg,#991b1b,#ef4444);
}

.painel{
    width:100%;
    min-height:calc(100vh - 115px);
    background:rgba(30,41,59,0.88);
    border:1px solid rgba(148,163,184,0.22);
    border-radius:22px;
    padding:26px;
    box-shadow:0 25px 70px rgba(0,0,0,0.38);
}

.clientes{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:24px;
    margin-bottom:26px;
}

label{
    display:block;
    margin-bottom:10px;
    color:#bfdbfe;
    font-size:13px;
    font-weight:bold;
    text-transform:uppercase;
    letter-spacing:.8px;
}

input,select{
    width:100%;
    padding:18px;
    border:1px solid rgba(148,163,184,0.28);
    border-radius:15px;
    background:#020617;
    color:white;
    outline:none;
    font-size:16px;
}

input::placeholder{
    color:#64748b;
}

input:focus,select:focus{
    border-color:#22c55e;
    box-shadow:0 0 0 4px rgba(34,197,94,0.16);
}

.grade-pdv{
    width:100%;
    display:grid;
    grid-template-columns:1.4fr 1fr 1fr;
    gap:24px;
    align-items:stretch;
}

.card{
    width:100%;
    min-height:520px;
    background:linear-gradient(180deg,rgba(15,23,42,0.78),rgba(15,23,42,0.48));
    border:1px solid rgba(148,163,184,0.22);
    border-radius:24px;
    padding:26px;
    box-shadow:0 18px 45px rgba(0,0,0,0.28);
}

.card h2{
    font-size:24px;
    margin-bottom:18px;
    text-align:center;
    color:#e2e8f0;
}

.total{
    height:calc(100% - 50px);
    min-height:250px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:58px;
    font-weight:900;
    color:#22c55e;
    padding:34px 20px;
    background:
        radial-gradient(circle at top, rgba(34,197,94,0.18), transparent 55%),
        rgba(34,197,94,0.09);
    border:1px solid rgba(34,197,94,0.32);
    border-radius:22px;
    text-align:center;
}

.botoes{
    height:100%;
    display:flex;
    flex-direction:column;
    gap:15px;
}

button{
    color:white;
    border:none;
    padding:22px;
    border-radius:17px;
    cursor:pointer;
    width:100%;
    font-size:19px;
    font-weight:bold;
    transition:.25s;
    box-shadow:0 14px 30px rgba(0,0,0,0.30);
}

.dinheiro{
    background:linear-gradient(135deg,#15803d,#22c55e);
}

.pix{
    background:linear-gradient(135deg,#0369a1,#38bdf8);
}

.cartao{
    background:linear-gradient(135deg,#6d28d9,#a855f7);
}

.fiado{
    background:linear-gradient(135deg,#ca8a04,#facc15);
    color:#111827;
}

.btn-add{
    margin-top:18px;
    background:linear-gradient(135deg,#2563eb,#38bdf8);
    min-height:58px;
    font-size:16px;
}

.carrinho-box{
    margin-top:22px;
    min-height:240px;
    max-height:300px;
    overflow-y:auto;
    padding:16px;
    background:rgba(2,6,23,0.48);
    border:1px solid rgba(148,163,184,0.20);
    border-radius:18px;
}

.carrinho-box h3{
    margin-bottom:14px;
    color:#38bdf8;
    font-size:18px;
}

.item-carrinho{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    padding:12px;
    margin-bottom:10px;
    background:#020617;
    border:1px solid rgba(148,163,184,0.16);
    border-radius:13px;
    font-size:14px;
}

.item-carrinho strong{
    color:white;
}

.item-carrinho span{
    color:#94a3b8;
    font-size:13px;
}

.item-carrinho button{
    width:auto;
    padding:8px 11px;
    background:#dc2626;
    font-size:13px;
    box-shadow:none;
}

.vazio{
    color:#94a3b8;
    font-size:14px;
}

@media(max-width:1100px){
    .topo{
        flex-direction:column;
        gap:18px;
        align-items:flex-start;
    }

    .links,
    .links a,
    .status{
        width:100%;
        text-align:center;
    }

    .clientes{
        grid-template-columns:1fr;
    }

    .grade-pdv{
        grid-template-columns:1fr;
    }

    .card{
        min-height:auto;
    }

    .total{
        height:auto;
        min-height:180px;
        font-size:40px;
    }
}
</style>
</head>

<body>

<form method="POST">
    {% csrf_token %}

    <button type="button" class="btn-voltar" onclick="history.back()">
        ← Voltar
    </button>

    <div class="topo">
        <h1>🛒 PDV</h1>

        <div class="links">
            <a href="/venda-fiado/" style="color:#facc15;">
                🤝 Dívidas / Prazo
            </a>
            <a href="/pdv/abrir-caixa/" style="color:#22c55e;">🟢 Abrir Caixa</a>
            <a href="/pdv/fechar-caixa/" style="color:#ef4444;">🔴 Fechar Caixa</a>
            <a href="/pdv/vendas/" style="color:#38bdf8;">🧾 Vendas do PDV</a>
            <a href="/pdv/pdf-caixa/" style="color:#facc15;">📄 PDF do Caixa</a>

            {% if caixa_aberto %}
                <span class="status aberto">🟢 Caixa Aberto</span>
            {% else %}
                <span class="status fechado">🔴 Caixa Fechado</span>
            {% endif %}
        </div>
    </div>

    <div class="painel">

        <div class="clientes">
            <div>
                <label>Cliente cadastrado</label>
                <select name="cliente">
                    <option value="">Consumidor Final</option>
                    {% for cliente in clientes %}
                        <option value="{{ cliente.id }}">{{ cliente.nome }}</option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label>Ou cadastrar cliente rápido</label>
                <input 
                    type="text" 
                    name="cliente_rapido" 
                    placeholder="Digite só o nome"
                >
            </div>
        </div>

        <div class="grade-pdv">

            <div class="card">

                <label>Produto</label>
                <select id="produto">
                    <option value="">Selecione um produto</option>

                    {% for produto in produtos %}
                        <option
                            value="{{ produto.id }}"
                            data-preco="{{ produto.preco_venda }}">
                            {{ produto.nome }} | Estoque: {{ produto.quantidade }} | R$ {{ produto.preco_venda }}
                        </option>
                    {% endfor %}
                </select>

                <label style="margin-top:18px;">Quantidade</label>
                <input
                    type="number"
                    id="quantidade"
                    step="0.001"
                    min="0.001"
                    placeholder="Ex: 0.500 kg">

                <button type="button" onclick="adicionarCarrinho()" class="btn-add">
                    ➕ Adicionar ao Carrinho
                </button>

                <div class="carrinho-box">
                    <h3>🛒 Carrinho</h3>

                    <div id="listaCarrinho">
                        <p class="vazio">Nenhum produto adicionado</p>
                    </div>
                </div>

                <input type="hidden" name="carrinho" id="carrinhoInput">

            </div>

            <div class="card">
                <h2>Total</h2>
                <div class="total">R$ 0,00</div>
            </div>

            <div class="card">
                <div class="botoes">
                    <button type="submit" name="forma_pagamento" value="dinheiro" class="dinheiro">
                        💵 Dinheiro
                    </button>

                    <button type="submit" name="forma_pagamento" value="pix" class="pix">
                        📱 Pix
                    </button>

                    <button type="submit" name="forma_pagamento" value="cartao" class="cartao">
                        💳 Cartão
                    </button>

                    <button type="submit" name="forma_pagamento" value="fiado" class="fiado">
                        🤝 divida a prazo
                    </button>
                </div>
            </div>

        </div>

    </div>

</form>

<script>
const produto = document.getElementById('produto');
const quantidade = document.getElementById('quantidade');
const total = document.querySelector('.total');
const listaCarrinho = document.getElementById('listaCarrinho');
const carrinhoInput = document.getElementById('carrinhoInput');

let carrinho = [];

function calcularTotalCarrinho(){
    let soma = 0;

    carrinho.forEach(item => {
        soma += item.preco * item.quantidade;
    });

    total.innerText = soma.toLocaleString(
        'pt-BR',
        {
            style:'currency',
            currency:'BRL'
        }
    );

    carrinhoInput.value = JSON.stringify(carrinho);
}

function adicionarCarrinho(){
    const option = produto.options[produto.selectedIndex];

    if(!produto.value){
        alert('Selecione um produto');
        return;
    }

    const qtd = parseFloat(quantidade.value || 0);

    if(qtd <= 0){
        alert('Informe uma quantidade válida');
        return;
    }

    const item = {
        produto_id: produto.value,
        nome: option.text.split('|')[0].trim(),
        preco: parseFloat(option.dataset.preco || 0),
        quantidade: qtd
    };

    carrinho.push(item);

    produto.value = '';
    quantidade.value = '';

    renderizarCarrinho();
    calcularTotalCarrinho();
}

function removerItem(index){
    carrinho.splice(index, 1);
    renderizarCarrinho();
    calcularTotalCarrinho();
}

function renderizarCarrinho(){
    listaCarrinho.innerHTML = '';

    if(carrinho.length === 0){
        listaCarrinho.innerHTML = '<p class="vazio">Nenhum produto adicionado</p>';
        return;
    }

    carrinho.forEach((item, index) => {
        const subtotal = item.preco * item.quantidade;

        listaCarrinho.innerHTML += `
            <div class="item-carrinho">
                <div>
                    <strong>${item.nome}</strong><br>
                    <span>${item.quantidade.toFixed(3)} kg - 
                    ${subtotal.toLocaleString('pt-BR', {
                        style:'currency',
                        currency:'BRL'
                    })}</span>
                </div>

                <button type="button" onclick="removerItem(${index})">
                    X
                </button>
            </div>
        `;
    });
}
</script>

</body>
</html>
